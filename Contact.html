<!DOCTYPE html>
    <html lang="fr">
        <head>
            <meta charset="utf-8">
            <title>Contact</title>
            <link id="theme-style" rel="stylesheet" href="style_light.css">
            <link rel="stylesheet" href="style_slide.css">
            <link rel="stylesheet" href="style_contact.css">
        </head>
        <body>
            <header>
                <div id="navi">
                    <a href="Accueil.html" ><p>Accueil</p></a>
                    <a href="Projets.html"><p>Projets</p></a>
                    <a href="Contact.html"><p class="current">Me contacter</p></a>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </header>
            <main>
                <form action="https://formspree.io/f/mqablrgz" method="POST">
                    <h1 id="meContact"> Me contacter !</h1>
                    <label>Nom
                        <input type="text" name="name" required>
                    </label>
                    <label>Email
                        <input type="email" name="email" required>
                    </label>
                    <label>Message
                        <textarea name="message" required></textarea>
                    </label>
                    <button type="submit">Envoyer</button>
                    <p id="refForm">Fonctionne avec <a href="https://formspree.io/" target="_blank" rel="noopener noreferrer">Formspree</a></p>
                </form>

            </main>
        </body>
    </html>

<script>
    // Gestion du bouton slide
    document.getElementById('theme-toggle').addEventListener('change', function () {
        if (this.checked) {
            // Exemple : passer en thème sombre
            document.getElementById('theme-style').href = 'style_dark.css';
            localStorage.setItem('theme', 'dark');

        } else {
            // Exemple : revenir au thème clair
            document.getElementById('theme-style').href = 'style_light.css';
            localStorage.setItem('theme', 'light');

        }
    });

    window.addEventListener('DOMContentLoaded', function () {
        const savedTheme = localStorage.getItem('theme');
        const toggle = document.getElementById('theme-toggle');

        if (savedTheme === 'dark') {
            document.getElementById('theme-style').href = 'style_dark.css';
            toggle.checked = true;
        } else {
            document.getElementById('theme-style').href = 'style_light.css';
            toggle.checked = false;
        }
    });

</script>
